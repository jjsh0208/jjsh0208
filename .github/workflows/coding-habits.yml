name: Coding Habits

on:
  schedule:
    # 매일 한국시간 오전 9시
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Coding Habits
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: jjsh0208

          filename: coding-habits.svg

          # 기본 프로필 정보 제거
          base: ""

          # Coding Habits
          plugin_habits: yes

          # 최근 최대 30일
          plugin_habits_days: 30

          # 분석할 GitHub 이벤트 수
          plugin_habits_from: 500

          # 개발 습관 정보
          plugin_habits_facts: yes

          # 시간대/요일 차트
          plugin_habits_charts: yes

          # SVG 그래프 스타일
          plugin_habits_charts_type: graph

          # 활동 없는 시간대 제거
          plugin_habits_trim: yes

          # 언어 최대 5개
          plugin_habits_languages_limit: 5

          # 2% 미만 언어 제외
          plugin_habits_languages_threshold: 2%

          # 한국 시간
          config_timezone: Asia/Seoul
