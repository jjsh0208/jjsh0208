name: Coding Habits

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Coding Habits
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: jjsh0208
          filename: coding-habits.svg
          base: ""

          plugin_habits: yes

          plugin_habits_days: 14
          plugin_habits_from: 100

          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: graph
          plugin_habits_trim: yes

          plugin_habits_languages_limit: 5
          plugin_habits_languages_threshold: 2%

          config_timezone: Asia/Seoul
